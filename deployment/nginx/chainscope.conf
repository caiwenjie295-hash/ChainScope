# 放入 Nginx 的 http 块包含的站点配置目录，例如 /etc/nginx/conf.d/。
# 将 server_name 改成你的域名或服务器公网 IP；root 改成实际网站目录。
# 宝塔面板已有站点时，请将 location/cache 规则合并到已有 server 块，避免重复创建。
server {
    listen 80;
    server_name chainscope.example.com;
    root /var/www/chainscope;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    autoindex off;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_vary on;

    # 带指纹的构建资源允许长缓存。
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 研究快照不使用长期缓存；缺失时保留 404，避免将 HTML 当 JSON 返回。
    location ^~ /data/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location ~ /\. {
        deny all;
    }

    # 页面状态使用查询参数，本项目无需 SPA 路由回退。
    location / {
        try_files $uri $uri/ =404;
    }
}
